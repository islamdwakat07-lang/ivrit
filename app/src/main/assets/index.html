:root{
  --paper:#F7F9FD; --card:#FFFFFF; --ink:#1F3C8C; --ink-soft:#E6EDFA; --rule:#D3DEF2;
  --margin:#D9534F; --ok:#2E8B57; --ok-soft:#E3F3EA; --bad:#C0392B; --bad-soft:#FBE7E4;
  --text:#18203A; --muted:#5E6984; --line:#E2E7F1; --gold:#C98A12;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --fs:17px; --on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --card:#171E2B; --ink:#8EB0FF; --ink-soft:#1E2A44; --rule:#25314A;
    --margin:#E26D69; --ok:#5CC48A; --ok-soft:#173326; --bad:#F07A6E; --bad-soft:#3A1E1B;
    --text:#E9EDF6; --muted:#9AA5BF; --line:#263044; --gold:#E7B347; --on-ink:#0E1424;
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --card:#171E2B; --ink:#8EB0FF; --ink-soft:#1E2A44; --rule:#25314A;
  --margin:#E26D69; --ok:#5CC48A; --ok-soft:#173326; --bad:#F07A6E; --bad-soft:#3A1E1B;
  --text:#E9EDF6; --muted:#9AA5BF; --line:#263044; --gold:#E7B347; --on-ink:#0E1424;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--text);font:400 var(--fs)/1.65 "Noto Kufi Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;overscroll-behavior-y:none}
body.big{--fs:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.he{font-family:"HePrint","Noto Sans Hebrew","Arial Hebrew",sans-serif;direction:rtl;unicode-bidi:isolate}
.cur{font-family:"HeCursive",cursive;direction:rtl;unicode-bidi:isolate;font-style:normal}
.tr{color:var(--ink);font-weight:600}
.muted{color:var(--muted)}
.hide-tr .tr-opt{display:none!important}

/* ===== رأس الصفحة: سطر دفتر بهامش أحمر ===== */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;padding:10px 16px 8px;border-bottom:1px solid var(--rule)}
header.top .back{border:0;background:none;font-size:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
header.top .back[hidden]{display:none}
header.top h1{margin:0;font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .gear{border:0;background:none;font-size:20px;width:40px;height:40px;border-radius:50%}
.stats{display:flex;gap:6px;font-size:14px;font-weight:700}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

main{max-width:640px;margin:0 auto;padding:16px 16px 110px;position:relative}

/* الهامش الأحمر للدفتر على يمين الصفحة */
.notebook{background:
  linear-gradient(to left, transparent 30px, var(--margin) 30px, var(--margin) 32px, transparent 32px),
  repeating-linear-gradient(var(--card) 0 35px, var(--rule) 35px 36px);
  border-radius:var(--r-lg);border:1px solid var(--line)}

/* ===== شريط التنقل السفلي ===== */
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--muted);padding:4px 6px;border-radius:12px;min-width:58px}
nav.tabs button b{font-size:21px;line-height:1.3;font-weight:400}
nav.tabs button.on{color:var(--ink);background:var(--ink-soft);font-weight:700}

/* ===== عناصر عامة ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 18px;font-weight:700;background:var(--ink);color:var(--on-ink);min-height:48px}
.btn.ghost{background:var(--ink-soft);color:var(--ink)}
.btn.line{background:none;border:2px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:46px;height:46px;font-size:20px;display:inline-grid;place-items:center;flex:none}
.icon-btn.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:17px;margin:0 0 6px}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--ink-soft);color:var(--ink);font-weight:700}
.pill.cog{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;bottom:90px;inset-inline:16px;max-width:600px;margin:auto;background:var(--text);color:var(--paper);padding:12px 16px;border-radius:var(--r);z-index:50;font-weight:600;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ===== الرئيسية ===== */
.hero{padding:22px 18px 18px 46px;margin-bottom:16px;position:relative;overflow:hidden}
.hero .word{font-size:64px;line-height:1.1;color:var(--ink)}
.hero p{margin:6px 0 14px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path:before{content:"";position:absolute;right:23px;top:10px;bottom:10px;width:3px;background:var(--rule);border-radius:2px}
.path li{position:relative;display:flex;align-items:center;gap:12px;padding:8px 0}
.path .dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;z-index:1;border:3px solid var(--rule);background:var(--card);font-size:15px}
.path li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.path li.now .dot{background:var(--ink);border-color:var(--ink);color:var(--on-ink);box-shadow:0 0 0 6px var(--ink-soft)}
.path li.lock{opacity:.5}
.path .unit{flex:1;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:8px}
.path li.now .unit{border-color:var(--ink);border-width:2px}
.path .unit small{display:block;color:var(--muted);font-size:13px}
.path .unit .he{font-size:22px;color:var(--ink)}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}

/* ===== الحروف ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.lt{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 4px 6px;text-align:center}
.lt .p{font-size:40px;line-height:1.2}
.lt .c{font-size:32px;line-height:1.1;color:var(--ink)}
.lt small{display:block;color:var(--muted);font-size:12px}
.lt.seen{border-color:var(--ok)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duo > div{border-radius:var(--r);padding:10px;text-align:center;background:var(--ink-soft)}
.duo .big{font-size:96px;line-height:1.5}
.duo .cur.big{color:var(--ink)}
.duo label{font-size:13px;color:var(--muted);font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin:4px 0 12px}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:0;font-weight:700}
.match{font-size:30px;color:var(--ok)}
.exword{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);border:1px dashed var(--line)}
.exword .he{font-size:34px}
.tip{background:#FFF6DD;color:#6A4B00;border-radius:var(--r-sm);padding:8px 12px;font-size:15px;margin-top:10px}
:root[data-theme="dark"] .tip{background:#3A2F12;color:#F2D78A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip{background:#3A2F12;color:#F2D78A}}

/* ===== الكتابة ===== */
.pad-wrap{position:relative;margin:0 auto 12px;max-width:420px}
canvas.pad{width:100%;aspect-ratio:1/1;display:block;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);touch-action:none}
.seg{display:flex;background:var(--ink-soft);border-radius:var(--r);padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.12)}
.score{text-align:center;font-weight:800;font-size:18px;min-height:30px}
.score .stars{font-size:26px}
.picker{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.picker button{flex:none;width:46px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:28px}
.picker button.on{border:2px solid var(--ink);background:var(--ink-soft)}

/* ===== البطاقات ===== */
.flash{min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 16px 40px;cursor:pointer;user-select:none}
.flash .front{font-size:52px;line-height:1.3}
.flash .front.cur{font-size:58px;color:var(--ink)}
.flash .back{margin-top:12px}
.flash .back .ar{font-size:24px;font-weight:800}
.flash .hint{color:var(--muted);font-size:14px;margin-top:10px}
.progress{height:8px;background:var(--ink-soft);border-radius:8px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:8px;transition:width .3s}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 12px;text-align:start}
.cat b{display:block;font-size:26px}
.cat small{color:var(--muted)}

/* ===== الاختبار ===== */
.q-prompt{text-align:center;padding:18px 10px;margin-bottom:12px}
.q-prompt .he{font-size:56px;line-height:1.3}
.q-prompt .cur{font-size:62px;color:var(--ink)}
.q-prompt .ask{color:var(--muted);font-weight:700;margin-bottom:6px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;font-weight:700;min-height:56px;text-align:center}
.opt .he{font-size:30px;font-weight:400}
.opt .cur{font-size:34px;color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:12px;border-radius:var(--r);padding:12px 14px;font-weight:700}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.result{text-align:center;padding:26px 16px}
.result .big{font-size:56px;font-weight:800;color:var(--ink)}

/* ===== الحوارات ===== */
.bubbles{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;border-radius:18px;padding:10px 14px;border:1px solid var(--line);background:var(--card)}
.bub.A{align-self:flex-start;border-start-start-radius:6px}
.bub.B{align-self:flex-end;background:var(--ink-soft);border-start-end-radius:6px;border-color:transparent}
.bub .he{font-size:24px;line-height:1.5}
.bub .ar{font-size:15px}
.bub .tools{display:flex;gap:6px;margin-top:6px}
.bub .tools button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;font-size:14px}
.bub.hidden-he .he{filter:blur(7px)}
.bub .heard{font-size:14px;margin-top:4px}
.bub.playing{outline:3px solid var(--gold)}

/* ===== المعلّم ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.chips button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}
.msg{max-width:90%;border-radius:18px;padding:10px 14px}
.msg.me{align-self:flex-end;background:var(--ink-soft)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg .he{font-size:22px;line-height:1.55}
.msg .fix{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:15px}
.msg .tipx{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:15px}
.composer{position:fixed;inset-inline:0;bottom:64px;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font:inherit;background:var(--card);color:var(--text);min-height:46px;max-height:120px}
.kbd{max-width:640px;margin:8px auto 0;display:grid;gap:5px}
.kbd .kr{display:flex;gap:4px;justify-content:center}
.kbd button{flex:1;max-width:40px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-family:"HePrint",sans-serif;font-size:20px;padding:0}
.kbd button.w{max-width:none;flex:3;font-family:inherit;font-size:14px}
.typing{color:var(--muted);font-size:15px}

/* ===== الإعدادات ===== */
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font:inherit;background:var(--card);color:var(--text)}
.field input[type=range]{padding:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px}
.note{font-size:14px;color:var(--muted)}
ol.steps{padding-inline-start:20px;margin:6px 0}

/* ===== القاموس والدرس اليومي والاختبارات ===== */
.daily .daily-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.daily .lvl{font-weight:800;font-size:18px;color:var(--ink)}
.exam-banner{width:100%;text-align:start;display:flex;gap:12px;align-items:center;border:2px solid var(--gold);background:linear-gradient(0deg,var(--card),var(--card))}
.exam-banner > b{font-size:30px}
.exam-banner > span:nth-child(2){flex:1}
.exam-banner .go{font-weight:800;color:var(--gold);white-space:nowrap}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.wrow .icon-btn{width:38px;height:38px;font-size:16px}
.wrow .wtxt{display:flex;flex-direction:column;min-width:0;flex:1.2}
.wrow .wtxt .he{font-size:22px;line-height:1.35}
.wrow .wtxt .tr{font-size:13px}
.wrow .war{flex:1;font-size:15px;font-weight:600}
.wrow .cogx{display:block;color:var(--ok);font-weight:700;font-size:12px}
.wrow .dotm{color:var(--ok);font-size:16px}
.cert{text-align:center;padding:12px}
.cert .cert-in{border:3px double var(--gold);border-radius:var(--r);padding:20px 14px;margin-bottom:12px;background:var(--paper)}
.lv-row{display:flex;justify-content:space-between;margin-top:12px}
.lv-row span{display:flex;flex-direction:column;align-items:center;font-size:26px;opacity:.35}
.lv-row span.on{opacity:1}
.lv-row small{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:8px 0 14px;border-bottom:1px solid var(--line)}
.bars i{flex:1;max-width:22px;border-radius:4px 4px 0 0;background:var(--ink)}
.bars i.hi{background:var(--ok)} .bars i.lo{background:var(--bad)} .bars i.mid{background:var(--gold)}
.hist{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist small{display:block;color:var(--muted);font-size:12px}
.hist b.good{color:var(--ok)} .hist b.bad{color:var(--bad)}

</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" aria-label="رجوع" hidden>→</button>
  <h1 id="title">عِبريت</h1>
  <div class="stats" id="stats"></div>
  <button class="gear" id="gear" aria-label="الإعدادات">⚙️</button>
</header>
<main id="view"></main>
<div id="composerSlot"></div>
<nav class="tabs">
  <button data-tab="home"><b>🏠</b>الدروس</button>
  <button data-tab="letters"><b><span class="cur">א</span></b>الحروف</button>
  <button data-tab="words"><b>🗂️</b>الكلمات</button>
  <button data-tab="dialogues"><b>💬</b>حوارات</button>
  <button data-tab="tutor"><b>🤖</b>المعلّم</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ===== محتوى تعليم العبرية =====
// كل حرف: الحرف، الشكل النهائي، الاسم بالعبرية، الاسم بالعربي، الصوت، الحرف العربي المقابل، مثال
const LETTERS = [
  {h:'א', name:'אָלֶף', nameAr:'ألِف', sound:'ا / همزة', ar:'ا', note:'حرف صامت يحمل الحركة، مثل الألف عندنا تماماً.', ex:{he:'אָב', tr:'آڤ', ar:'أب', cog:true}},
  {h:'ב', name:'בֵּית', nameAr:'بيت', sound:'ب / ڤ', ar:'ب', note:'مع نقطة في وسطه (בּ) يُلفظ ب، وبدون نقطة (ב) يُلفظ ڤ مثل V.', ex:{he:'בַּיִת', tr:'بايِت', ar:'بيت', cog:true}},
  {h:'ג', name:'גִּימֶל', nameAr:'جيمِل', sound:'ج مصرية (G)', ar:'ج', note:'يُلفظ مثل الجيم المصرية في كلمة "جمل" عند المصريين.', ex:{he:'גָּמָל', tr:'جامال', ar:'جمل', cog:true}},
  {h:'ד', name:'דָּלֶת', nameAr:'داليت', sound:'د', ar:'د', note:'نفس صوت الدال العربية.', ex:{he:'דֶּרֶךְ', tr:'ديريخ', ar:'طريق (درب)', cog:true}},
  {h:'ה', name:'הֵא', nameAr:'هيه', sound:'هـ', ar:'ه', note:'مثل الهاء. في آخر الكلمة غالباً لا يُلفظ، مثل التاء المربوطة الساكنة.', ex:{he:'הַר', tr:'هار', ar:'جبل'}},
  {h:'ו', name:'וָו', nameAr:'ڤاڤ', sound:'ڤ / و / أو', ar:'و', note:'حرف ساكن يُلفظ ڤ، وكحرف علة يصبح "و" (וּ) أو "أو" (וֹ).', ex:{he:'וֶרֶד', tr:'ڤيريد', ar:'وردة', cog:true}},
  {h:'ז', name:'זַיִן', nameAr:'زايِن', sound:'ز', ar:'ز', note:'نفس صوت الزاي.', ex:{he:'זַיִת', tr:'زايِت', ar:'زيتون', cog:true}},
  {h:'ח', name:'חֵית', nameAr:'حيت', sound:'ح / خ', ar:'ح', note:'أصله الحاء، لكن أغلب الإسرائيليين اليوم يلفظونه خاءً.', ex:{he:'חָלָב', tr:'حالاڤ', ar:'حليب', cog:true}},
  {h:'ט', name:'טֵית', nameAr:'طيت', sound:'ط (تُلفظ ت)', ar:'ط', note:'أصله الطاء، واليوم يُلفظ تاءً عادية.', ex:{he:'טוֹב', tr:'طوڤ', ar:'جيد (طيّب)', cog:true}},
  {h:'י', name:'יוֹד', nameAr:'يود', sound:'ي', ar:'ي', note:'أصغر حرف في العبرية، يشبه الفاصلة المرفوعة.', ex:{he:'יוֹם', tr:'يوم', ar:'يوم', cog:true}},
  {h:'כ', fin:'ך', name:'כַּף', nameAr:'كاف', sound:'ك / خ', ar:'ك', note:'مع نقطة (כּ) = ك، بدون نقطة (כ) = خ. في آخر الكلمة يُكتب ך.', ex:{he:'כֶּלֶב', tr:'كيليڤ', ar:'كلب', cog:true}},
  {h:'ל', name:'לָמֶד', nameAr:'لاميد', sound:'ل', ar:'ل', note:'الحرف الوحيد الذي يرتفع فوق السطر.', ex:{he:'לֶחֶם', tr:'ليحِم', ar:'خبز', tip:'انتبه: لحم بالعبرية يعني خبز!'}},
  {h:'מ', fin:'ם', name:'מֵם', nameAr:'ميم', sound:'م', ar:'م', note:'في آخر الكلمة يُكتب ם (مربّع مغلق).', ex:{he:'מַיִם', tr:'مايِم', ar:'ماء', cog:true}},
  {h:'נ', fin:'ן', name:'נוּן', nameAr:'نون', sound:'ن', ar:'ن', note:'في آخر الكلمة يُكتب ן (خط طويل ينزل تحت السطر).', ex:{he:'נֵר', tr:'نير', ar:'شمعة (من النور)', cog:true}},
  {h:'ס', name:'סָמֶךְ', nameAr:'ساميخ', sound:'س', ar:'س', note:'دائرة مغلقة، صوتها سين.', ex:{he:'סֵפֶר', tr:'سيفِر', ar:'كتاب (سِفْر)', cog:true}},
  {h:'ע', name:'עַיִן', nameAr:'عايِن', sound:'ع (تُلفظ أ)', ar:'ع', note:'أصله العين، وأغلب الناس اليوم يلفظونه همزة خفيفة.', ex:{he:'עַיִן', tr:'عايِن', ar:'عين', cog:true}},
  {h:'פ', fin:'ף', name:'פֵּא', nameAr:'پيه', sound:'پ / ف', ar:'ف', note:'مع نقطة (פּ) = P، بدون نقطة (פ) = ف. في آخر الكلمة ף.', ex:{he:'פֶּה', tr:'پيه', ar:'فم (فَه)', cog:true}},
  {h:'צ', fin:'ץ', name:'צָדִי', nameAr:'تسادي', sound:'تس', ar:'ص', note:'يقابل الصاد، لكن يُلفظ "تس" مثل آخر كلمة pizza.', ex:{he:'צֵל', tr:'تسيل', ar:'ظل', cog:true}},
  {h:'ק', name:'קוֹף', nameAr:'كوف', sound:'ق (تُلفظ ك)', ar:'ق', note:'أصله القاف، واليوم يُلفظ كافاً.', ex:{he:'קוֹל', tr:'كول', ar:'صوت (قول)', cog:true}},
  {h:'ר', name:'רֵישׁ', nameAr:'ريش', sound:'ر (قريبة من غ)', ar:'ر', note:'يلفظها أغلب الإسرائيليين من الحلق، قريبة من الغين.', ex:{he:'רֹאשׁ', tr:'روش', ar:'رأس', cog:true}},
  {h:'ש', name:'שִׁין', nameAr:'شين', sound:'ش / س', ar:'ش', note:'نقطة على اليمين (שׁ) = ش، نقطة على اليسار (שׂ) = س.', ex:{he:'שֶׁמֶשׁ', tr:'شيميش', ar:'شمس', cog:true}},
  {h:'ת', name:'תָּו', nameAr:'تاڤ', sound:'ت', ar:'ت', note:'نفس صوت التاء.', ex:{he:'תּוּת', tr:'توت', ar:'توت', cog:true}},
];

// الحركات (النيقود)
const NIQQUD = [
  {mark:'בַּ', name:'פַּתָּח / קָמָץ', ar:'فتحة', sound:'a', tr:'بَ', note:'خط تحت الحرف (ַ) أو شكل T تحته (ָ) = فتحة.'},
  {mark:'בֶּ', name:'סֶגּוֹל / צֵירֵי', ar:'إمالة (e)', sound:'e', tr:'بيـ', note:'ثلاث نقاط (ֶ) أو نقطتان أفقيتان (ֵ) = صوت e مثل "بيت" باللهجة.'},
  {mark:'בִּי', name:'חִירִיק', ar:'كسرة', sound:'i', tr:'بي', note:'نقطة واحدة تحت الحرف (ִ) = كسرة طويلة.'},
  {mark:'בּוֹ', name:'חוֹלָם', ar:'ضمة ممالة (o)', sound:'o', tr:'بو', note:'نقطة فوق حرف الواو (וֹ) = صوت o.'},
  {mark:'בּוּ', name:'שׁוּרוּק / קֻבּוּץ', ar:'ضمة (u)', sound:'u', tr:'بو', note:'نقطة في وسط الواو (וּ) أو ثلاث نقاط مائلة (ֻ) = ضمة.'},
  {mark:'בְּ', name:'שְׁוָא', ar:'سكون', sound:'-', tr:'بْ', note:'نقطتان عموديتان (ְ) = سكون غالباً، وأحياناً e خفيفة جداً.'},
];

// المفردات: he = بالحركات، tr = النطق بأحرف عربية، ar = المعنى، cog = كلمة عربية شقيقة
const VOCAB = [
  {id:'greet', title:'تحيات وأساسيات', icon:'👋', words:[
    {he:'שָׁלוֹם', tr:'شالوم', ar:'سلام / مرحباً', cog:'سلام'},
    {he:'בֹּקֶר טוֹב', tr:'بوكِر طوڤ', ar:'صباح الخير'},
    {he:'עֶרֶב טוֹב', tr:'عيرِڤ طوڤ', ar:'مساء الخير'},
    {he:'לַיְלָה טוֹב', tr:'لايلا طوڤ', ar:'تصبح على خير', cog:'ليلة'},
    {he:'תּוֹדָה', tr:'تودا', ar:'شكراً'},
    {he:'תּוֹדָה רַבָּה', tr:'تودا رابّا', ar:'شكراً جزيلاً'},
    {he:'בְּבַקָּשָׁה', tr:'بِڤَكّاشا', ar:'من فضلك / تفضّل / عفواً'},
    {he:'כֵּן', tr:'كين', ar:'نعم'},
    {he:'לֹא', tr:'لو', ar:'لا', cog:'لا'},
    {he:'סְלִיחָה', tr:'سْليحا', ar:'عفواً / آسف'},
    {he:'מָה שְׁלוֹמְךָ?', tr:'ما شلومْخا؟', ar:'كيف حالك؟'},
    {he:'בְּסֵדֶר', tr:'بِسيدِر', ar:'تمام / بخير'},
    {he:'לְהִתְרָאוֹת', tr:'لِهِتراؤوت', ar:'إلى اللقاء'},
    {he:'אֲנִי לֹא מֵבִין', tr:'أني لو ميڤين', ar:'أنا لا أفهم'},
    {he:'לְאַט', tr:'لِأَط', ar:'ببطء'},
    {he:'רֶגַע', tr:'ريغَع', ar:'لحظة'},
  ]},
  {id:'people', title:'أشخاص وعائلة', icon:'👨‍👩‍👧', words:[

<script>

'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (arr, n, not) => shuffle(arr.filter(x => x !== not)).slice(0, n);

const today = () => new Date().toISOString().slice(0, 10);

// ---------- التخزين ----------
const DEF = {done:{}, xp:0, streak:{last:'', n:0}, srs:{}, mistakes:{}, seen:{}, written:{},
  set:{key:'', model:'gemini-flash-latest', rate:0.8, showTr:true, big:false, theme:'auto', script:'print'}};
let S;
function load(){ try { S = JSON.parse(localStorage.getItem('ivrit') || 'null'); } catch(e) { S = null; }
  S = Object.assign(structuredClone(DEF), S || {}); S.set = Object.assign({}, DEF.set, S.set || {}); }
function save(){ try { localStorage.setItem('ivrit', JSON.stringify(S)); } catch(e) {} }
load();

function addXP(n){
  S.xp += n; const t = today();
  if (S.streak.last !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1; S.streak.last = t;
  }
  save(); renderStats();
}
function miss(key){ S.mistakes[key] = (S.mistakes[key] || 0) + 1; save(); }
function fixMiss(key){ if (S.mistakes[key]) { S.mistakes[key]--; if (S.mistakes[key] <= 0) delete S.mistakes[key]; save(); } }

// ---------- الصوت ----------
let heVoice = null;
function findVoice(){ const v = speechSynthesis?.getVoices?.() || []; heVoice = v.find(x => /^(he|iw)/i.test(x.lang)) || null; }
if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
let audioEl = null;
// ---- جسر تطبيق الأندرويد (APK) ----
const NB = window.AndroidBridge || null;
const nbCalls = {}; let nbSeq = 0;
const nbCall = (fn) => new Promise(res => { const id = 'n' + (++nbSeq); nbCalls[id] = res; fn(id); });
window.onNativeSpeak = id => { nbCalls[id]?.(); delete nbCalls[id]; };
window.onNativeListen = (id, code, json) => { nbCalls[id]?.({code, json}); delete nbCalls[id]; };
window.onNativeHttp = (id, code, text) => { nbCalls[id]?.({code, text}); delete nbCalls[id]; };
const nbHas = k => { try { return !!NB && NB[k]() === '1'; } catch(e) { return false; } };
window.__back = () => { if ((location.hash || '#home') !== '#home') { history.back(); return 1; } return 0; };
function speak(text, slow, quiet){
  const rate = slow ? 0.55 : S.set.rate;
  if (nbHas('hasTTS')) return nbCall(id => NB.speak(id, text, rate));
  return new Promise(res => {
    if ('speechSynthesis' in window && heVoice) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.voice = heVoice; u.lang = heVoice.lang; u.rate = rate;
      u.onend = u.onerror = () => res(); speechSynthesis.speak(u);
    } else {
      // بديل: صوت جوجل عبر الإنترنت (يعمل داخل تطبيق APK أيضاً)
      if (!navigator.onLine) { if (!quiet) toast('النطق يحتاج إنترنت أو صوت عبري مثبت على الهاتف'); return res(); }
      try { audioEl?.pause(); } catch(e) {}
      audioEl = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=iw&ttsspeed=' + (rate < 0.7 ? 0.24 : 1) + '&q=' + encodeURIComponent(stripNiqqud(text)));
      audioEl.onended = audioEl.onerror = () => res(); audioEl.play().catch(() => { if (!quiet) toast('تعذّر تشغيل الصوت، تأكد من الإنترنت'); res(); });
    }
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(lang = 'he-IL'){
  if (nbHas('hasSTT')) return nbCall(id => NB.listen(id, lang)).then(r => {
    if (r.code === 'ok') return JSON.parse(r.json);
    throw new Error(r.code === 'perm' ? 'perm' : r.code);
  });
  return new Promise((res, rej) => {
    if (!SR) return rej(new Error('nosr'));
    const r = new SR(); r.lang = lang; r.interimResults = false; r.maxAlternatives = 3;
    let got = false;
    r.onresult = e => { got = true; res([...e.results[0]].map(a => a.transcript)); };
    r.onerror = e => rej(new Error(e.error)); r.onend = () => { if (!got) rej(new Error('no-speech')); };
    r.start();
  });
}
function similarity(a, b){
  a = normHe(a).replace(/ /g, ''); b = normHe(b).replace(/ /g, '');
  if (!a || !b) return 0;
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n);
}
function micError(e){
  if (e.message === 'perm') toast('اسمح للتطبيق باستخدام الميكروفون، ثم اضغط 🎤 مرة أخرى');
  else if (e.message === 'nosr') toast('التعرّف على الصوت غير مدعوم هنا. افتح التطبيق من متصفح Chrome.');
  else if (e.message === 'not-allowed') toast('اسمح للتطبيق باستخدام الميكروفون');
  else toast('لم أسمع شيئاً، حاول مرة ثانية وتكلّم بوضوح');
}

routes.unit = (id, step = '0') => {
  const u = UNITS.find(x => x.id === id); if (!u) return go('home');
  title(u.title); lastTab = 'home';
  const st = +step;
  if (u.type === 'letters') {
    const seq = [...u.idx.map(i => ({k:'learn', i})), ...u.idx.map(i => ({k:'write', i})), {k:'quiz'}];
    const s = seq[st];
    const nextH = st + 1 < seq.length ? `unit/${id}/${st + 1}` : null;
    if (s.k === 'learn') return letterDetail(s.i, {next:nextH, stepTxt:`الخطوة ${st + 1} من ${seq.length}`});
    if (s.k === 'write') return writePad(s.i, {next:nextH, stepTxt:`الخطوة ${st + 1} من ${seq.length}`, script:'cursive'});
    return runQuiz(letterQuestions(u.idx), {unit:id});
  }
  if (u.type === 'finals') { if (st === 0) return finalsView({next:`unit/${id}/1`}); return runQuiz(finalsQuestions(), {unit:id}); }
  if (u.type === 'niqqud') { if (st === 0) return niqqudView({next:`unit/${id}/1`}); return runQuiz(niqqudQuestions(), {unit:id}); }
  if (u.type === 'vocab') {
    const c = VOCAB.find(x => x.id === u.cat), ws = c.words.slice(u.from, u.to);
    if (st === 0) return flashcards(ws, {title:u.title, next:`unit/${id}/1`, learn:true});
    return runQuiz(vocabQuestions(ws, c.words), {unit:id});
  }
  if (u.type === 'dialogue') {
    const d = DIALOGUES.find(x => x.id === u.dlg);
    if (st === 0) return dialogueView(d, {next:`unit/${id}/1`});
    return runQuiz(dialogueQuestions(d), {unit:id});
  }
};

routes.write = (i, sc) => writePad(+i || 0, {script:sc || 'cursive', free:true});
function writePad(i, o){
  const l = LETTERS[i]; title('اكتب: ' + l.nameAr);
  let script = o.script || 'cursive', guide = true, glyph = l.h;
  view().innerHTML = `
  ${o.stepTxt ? `<div class="muted" style="font-weight:700">${o.stepTxt}</div>` : ''}
  ${o.free ? `<div class="picker" id="picker">${LETTERS.map((x, k) => `<button class="${k === i ? 'on' : ''} he" onclick="go('write/${k}/${script}')">${x.h}</button>`).join('')}</div>` : ''}
  <div class="seg" id="seg"><button data-s="cursive">يدوي</button><button data-s="print">طباعي</button></div>
  ${l.fin ? `<div class="seg" id="segf"><button data-g="${l.h}" class="on">${l.h} عادي</button><button data-g="${l.fin}">${l.fin} نهائي</button></div>` : ''}
  <p class="muted" style="margin:0 0 10px;text-align:center">اكتب الحرف بإصبعك فوق الشكل الباهت. <b>العبرية تُكتب من اليمين لليسار</b> مثل العربية.</p>
  <div class="pad-wrap"><canvas class="pad" id="pad"></canvas></div>
  <div class="score" id="score"></div>
  <div class="row" style="margin-bottom:10px">
    <button class="icon-btn" id="clr" aria-label="امسح">🧽</button>
    <button class="icon-btn" id="gd" aria-label="إظهار أو إخفاء الدليل">👁</button>
    ${spk(l.name)}
    <button class="btn" id="chk" style="flex:1">تحقّق ✓</button>
  </div>
  ${o.next ? `<button class="btn ghost wide" onclick="go('${o.next}')">التالي ◀</button>` : ''}`;
  const cv = $('#pad'), ctx = cv.getContext('2d');
  let W, strokes = [], cur = null;
  const segBtns = () => $('#seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === script));
  segBtns();
  const fontFor = sz => (script === 'cursive' ? `${sz}px HeCursive` : `${sz}px HePrint`);
  // يضع الحرف في وسط اللوح مهما كان طوله (ل الطويلة، ن النهائية...)
  function glyphFit(c, w){
    c.font = fontFor(100); const m = c.measureText(glyph);
    const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent, h = asc + desc;
    const wid = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    const k = Math.min(w * 0.62 / h, w * 0.6 / wid, (script === 'cursive' ? 0.62 : 0.6) * w / 60);
    const sz = 100 * k; const y = w / 2 + (asc - desc) / 2 * k;
    const x = w / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 * k;
    return {sz, x, y};
  }
  function drawGlyph(c, w, alpha, color, strokeW){
    c.save(); c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.direction = 'ltr';
    const f = glyphFit(c, w); c.font = fontFor(f.sz); c.globalAlpha = alpha;
    if (strokeW) { c.strokeStyle = color; c.lineWidth = strokeW; c.lineJoin = 'round'; c.strokeText(glyph, f.x, f.y); }
    c.fillStyle = color; c.fillText(glyph, f.x, f.y); c.restore();
  }
  function paint(){
    const css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, W, W);
    // سطور الدفتر
    ctx.strokeStyle = css.getPropertyValue('--rule').trim(); ctx.lineWidth = 2;
    [0.28, 0.7].forEach(y => { ctx.beginPath(); ctx.moveTo(10, W * y); ctx.lineTo(W - 10, W * y); ctx.stroke(); });
    ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(10, W * 0.49); ctx.lineTo(W - 10, W * 0.49); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = css.getPropertyValue('--margin').trim(); ctx.beginPath(); ctx.moveTo(W - 26, 0); ctx.lineTo(W - 26, W); ctx.stroke();
    if (guide) drawGlyph(ctx, W, 0.16, css.getPropertyValue('--text').trim());
    ctx.strokeStyle = css.getPropertyValue('--ink').trim(); ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = W / 34;
    strokes.forEach(s => { ctx.beginPath(); s.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (s.length === 1) ctx.lineTo(s[0][0] + .1, s[0][1]); ctx.stroke(); });
  }
  function size(){ const r = cv.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1; W = r.width; cv.width = W * dpr; cv.height = W * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); paint(); }
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); $('#score').innerHTML = ''; paint(); };
  cv.onpointermove = e => { if (!cur) return; cur.push(pt(e)); paint(); };
  cv.onpointerup = cv.onpointercancel = () => { cur = null; };
  $('#clr').onclick = () => { strokes = []; $('#score').innerHTML = ''; paint(); };
  $('#gd').onclick = () => { guide = !guide; paint(); toast(guide ? 'الدليل ظاهر' : 'الدليل مخفي: جرّب من ذاكرتك'); };
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; script = b.dataset.s; segBtns(); strokes = []; paint(); };
  if (l.fin) $('#segf').onclick = e => { const b = e.target.closest('button'); if (!b) return; glyph = b.dataset.g; $('#segf').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); strokes = []; paint(); };
  $('#chk').onclick = () => {
    if (!strokes.length) return toast('اكتب الحرف أولاً');
    const N = 96, mk = () => { const c = document.createElement('canvas'); c.width = c.height = N; return c.getContext('2d'); };
    const g = mk(); drawGlyph(g, N, 1, '#000');
    const gd = mk(); drawGlyph(gd, N, 1, '#000', 9);
    const drawU = (c, lw) => { c.strokeStyle = '#000'; c.lineCap = c.lineJoin = 'round'; c.lineWidth = lw; const k = N / W;
      strokes.forEach(s => { c.beginPath(); s.forEach((p, j) => j ? c.lineTo(p[0] * k, p[1] * k) : c.moveTo(p[0] * k, p[1] * k)); if (s.length === 1) c.lineTo(s[0][0] * k + .1, s[0][1] * k); c.stroke(); }); };
    const u = mk(); drawU(u, 3.2); const ud = mk(); drawU(ud, 11);
    const A = c => c.getImageData(0, 0, N, N).data;
    const G = A(g), GD = A(gd), U = A(u), UD = A(ud);
    let gT = 0, gHit = 0, uT = 0, uIn = 0;
    for (let p = 3; p < G.length; p += 4) {
      if (G[p] > 100) { gT++; if (UD[p] > 60) gHit++; }
      if (U[p] > 100) { uT++; if (GD[p] > 60) uIn++; }
    }
    const R = gT ? gHit / gT : 0, P = uT ? uIn / uT : 0, F = R + P ? 2 * R * P / (R + P) : 0;
    const n = F >= 0.72 ? 3 : F >= 0.52 ? 2 : F >= 0.32 ? 1 : 0;
    const msg = ['حاول مرة ثانية، تتبّع الشكل الباهت ببطء', 'بداية جيدة! حاول أن تغطي الشكل كله', 'جيد جداً! 👏', 'ممتاز! خطّك رائع 🎉'][n];
    $('#score').innerHTML = `<div class="stars">${stars(n)}</div><div>${msg}</div>`;
    if (n >= 2) { addXP(n * 2); S.written[l.h] = Math.max(S.written[l.h] || 0, n); save(); }
    if (n === 3 && guide) setTimeout(() => toast('جرّب الآن بدون دليل 👁'), 1200);
  };
  document.fonts.load(fontFor(40), glyph).then(size);
  window.onresize = () => { if (cv.isConnected) size(); };
}

  const r = S.srs[w.he] || {box:0, due:0};

  r.due = Date.now() + [0.007, 1, 2, 4, 8, 16][r.box] * 864e5; // أيام

}

    </div>
    <div class="row" style="margin-bottom:10px">${spk(w.he)}${spkSlow(w.he)}<button class="icon-btn" id="mic" aria-label="انطقها">🎤</button><button class="btn line" style="flex:1" onclick="askTutorWord('${esc(w.he)}')">🤖 اسأل المعلّم عنها</button></div>

function letterQuestions(idx, n){
  const pool = idx.map(i => LETTERS[i]); const all = LETTERS;
  const qs = [];
  pool.forEach(l => {
    qs.push({key:'l:' + l.h, ask:'ما اسم هذا الحرف؟', prompt:`<div class="he">${l.h}</div>`, say:l.name, ans:l.nameAr + ' (' + l.ar + ')', opts:[l, ...pick(all, 3, l)].map(x => x.nameAr + ' (' + x.ar + ')')});
    qs.push({key:'c:' + l.h, ask:'هذا الحرف مكتوب باليد. أي حرف هو؟', prompt:`<div class="cur">${l.h}</div>`, ans:l.h, opts:[l, ...pick(all, 3, l)].map(x => x.h), optCls:'he', two:true});
    qs.push({key:'p:' + l.h, ask:'أي حرف يدوي يقابل هذا الحرف الطباعي؟', prompt:`<div class="he">${l.h}</div>`, ans:l.h, opts:[l, ...pick(all, 3, l)].map(x => x.h), optCls:'cur', two:true});
    qs.push({key:'a:' + l.h, ask:'أي حرف عبري يقابل الحرف العربي:', prompt:`<div style="font-size:56px;font-weight:800;color:var(--ok)">${l.ar}</div>`, ans:l.h, opts:[l, ...pick(all, 3, l)].map(x => x.h), optCls:'he', two:true});
  });
  return shuffle(qs).slice(0, n || Math.min(qs.length, Math.max(8, pool.length * 3)));
}
function finalsQuestions(){
  const fl = LETTERS.filter(l => l.fin), fins = fl.map(l => l.fin);
  const bases = fl.map(l => l.h);
  const qs = fl.map(l => ({key:'f:' + l.h, ask:`ما الشكل النهائي للحرف ${l.nameAr}؟`, prompt:`<div class="he">${l.h}</div>`, ans:l.fin, opts:[l.fin, ...pick(fins, 3, l.fin)], optCls:'he', two:true}));
  fl.forEach(l => qs.push({key:'fc:' + l.h, ask:'هذا حرف نهائي مكتوب باليد. ما أصله؟', prompt:`<div class="cur">${l.fin}</div>`, ans:l.h, opts:[l.h, ...pick(bases, 3, l.h)], optCls:'he', two:true}));
  return shuffle(qs);
}
function niqqudQuestions(){
  const sy = [['בַּ','بَ (a)'],['בֶּ','بيـ (e)'],['בִּי','بي (i)'],['בּוֹ','بو (o)'],['בּוּ','بو (u)'],['מָ','مَ (a)'],['מִי','مي (i)'],['לוֹ','لو (o)'],['שׁוּ','شو (u)'],['דֵּ','ديـ (e)'],['סָ','سَ (a)'],['נוּ','نو (u)']];
  const sounds = ['a','e','i','o','u'];
  return shuffle(sy).slice(0, 9).map(([h, a]) => { const so = a.match(/\((.)\)/)[1];
    return {key:'n:' + h, ask:'كيف تقرأ هذا المقطع؟', prompt:`<div class="he">${h}</div>`, say:h, ans:a, opts:[a, ...pick(sy.filter(x => x[1].match(/\((.)\)/)[1] !== so), 3).map(x => x[1])]}; });
}
function vocabQuestions(ws, pool){
  const qs = [];
  ws.forEach((w, k) => {
    const others = pick(pool, 3, w);
    const t = k % 3;
    if (t === 0) qs.push({key:'w:' + w.he, ask:'ما معنى هذه الكلمة؟', prompt:`<div class="he">${w.he}</div>`, say:w.he, ans:w.ar, opts:[w, ...others].map(x => x.ar)});
    if (t === 1) qs.push({key:'w:' + w.he, ask:'كيف تقول بالعبرية:', prompt:`<div style="font-size:30px;font-weight:800">${w.ar}</div>`, ans:w.he, opts:[w, ...others].map(x => x.he), optCls:'he'});
    if (t === 2) qs.push({key:'w:' + w.he, ask:'استمع 🔊 واختر المعنى', prompt:`<button class="icon-btn" style="width:90px;height:90px;font-size:40px" data-say="${esc(w.he)}">🔊</button>`, say:w.he, autoSay:true, ans:w.ar, opts:[w, ...others].map(x => x.ar)});
  });
  ws.slice(0, 3).forEach(w => qs.push({key:'w:' + w.he, ask:'هذه الكلمة مكتوبة باليد. ما معناها؟', prompt:`<div class="cur">${stripNiqqud(w.he)}</div>`, say:w.he, ans:w.ar, opts:[w, ...pick(pool, 3, w)].map(x => x.ar)}));
  return shuffle(qs);
}
function dialogueQuestions(d){
  const all = DIALOGUES.flatMap(x => x.lines);

}

function runQuiz(qs, o){
  let i = 0, right = 0, answered = false; const wrongs = [];
  title('اختبار');
  const draw = () => {
    if (i >= qs.length) return finish();
    const q = qs[i]; answered = false;
    const opts = shuffle([...new Set(q.opts)]);
    view().innerHTML = `
    <div class="progress"><i style="width:${i / qs.length * 100}%"></i></div>
    <div class="card notebook q-prompt"><div class="ask">${q.ask}</div>${q.prompt}</div>
    <div class="opts ${q.two ? 'two' : ''}">${opts.map(op => `<button class="opt" data-v="${esc(op)}"><span class="${q.optCls || ''}" ${q.small ? 'style="font-size:22px"' : ''}>${esc(op)}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
    view().querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = b.dataset.v === q.ans;
      view().querySelectorAll('.opt').forEach(x => { if (x.dataset.v === q.ans) x.classList.add('right'); });
      if (ok) { right++; fixMiss(q.key); } else { b.classList.add('wrong'); miss(q.key); wrongs.push(q); }
      if (!q.retry && o.onAnswer) o.onAnswer(q, ok);
      $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? pickPraise() : 'الجواب الصحيح: <span class="' + (q.optCls || '') + '" style="font-size:1.3em">' + esc(q.ans) + '</span>' + (q.extra ? '<br>' + q.extra : '') + (o.exam ? '' : '<br><small>لا مشكلة، سنعيد هذا السؤال في آخر الاختبار.</small>')}</div>
        <button class="btn wide" style="margin-top:10px" id="nq">متابعة ◀</button>`;
      if (q.say) speak(q.say);
      if (!ok && !q.retry && !o.exam) qs.push(Object.assign({}, q, {retry:true}));
      $('#nq').onclick = () => { i++; draw(); }; $('#nq').focus();
    });
    if (q.autoSay) setTimeout(() => speak(q.say, false, true), 300);
  };
  const finish = () => {
    const first = qs.filter(q => !q.retry).length, firstRight = first - wrongs.length;
    const pct = Math.round(firstRight / first * 100);
    const st = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
    addXP(firstRight * 2 + st * 5);
    if (o.unit && st >= 1) { S.done[o.unit] = Math.max(S.done[o.unit] || 0, st); save(); }
    if (o.onFinish) return o.onFinish(pct, firstRight, first, wrongs);
    const nu = nextUnit();
    view().innerHTML = `<div class="card result">
      <div class="big">${pct}%</div><div class="stars" style="font-size:34px">${stars(st)}</div>
      <h2>${st === 3 ? 'ممتاز! أنت تتقدّم بسرعة 🎉' : st === 2 ? 'جيد جداً! 👏' : st === 1 ? 'نجحت! راجع أخطاءك لتتحسّن' : 'لا بأس، التكرار هو سرّ الحفظ. أعد الدرس مرة أخرى'}</h2>
      <p class="muted">${firstRight} من ${first} إجابات صحيحة من أول مرة</p>
      <div class="row">
        ${o.unit && st >= 1 && nu ? `<button class="btn" onclick="go('unit/${nu.id}')">الدرس التالي ◀</button>` : ''}
        ${o.unit && st === 0 ? `<button class="btn" onclick="go('unit/${o.unit}')">أعد الدرس</button>` : ''}
        <button class="btn ghost" onclick="go('${o.back || 'home'}')">رجوع</button>
      </div></div>`;
  };
  draw();
}

routes.review = () => {
  const keys = Object.keys(S.mistakes); if (!keys.length) { toast('لا توجد أخطاء للمراجعة 👏'); return go('home'); }
  const qs = [];
  keys.forEach(k => {
    const [t, v] = [k.split(':')[0], k.slice(k.indexOf(':') + 1)];
    const l = LETTERS.find(x => x.h === v || x.fin === v);
    if (['l','c','p','a'].includes(t) && l) qs.push(...letterQuestions([LETTERS.indexOf(l)]).filter(q => q.key === k));
    else if (t === 'w') { const c = VOCAB.find(c => c.words.some(w => w.he === v)); if (c) qs.push(...vocabQuestions([c.words.find(w => w.he === v)], c.words).slice(0, 1)); }
    else if (t === 'd') { const d = DIALOGUES.find(d => d.lines.some(l => l.he === v)); if (d) qs.push(...dialogueQuestions({lines:[d.lines.find(l => l.he === v)]})); }
    else if (t === 'f' || t === 'fc') qs.push(...finalsQuestions().filter(q => q.key === k));
    else if (t === 'n') qs.push(...niqqudQuestions().filter(q => q.key === k));
  });
  if (!qs.length) { S.mistakes = {}; save(); return go('home'); }
  runQuiz(shuffle(qs).slice(0, 12), {back:'home'}); title('مراجعة الأخطاء');
};

const MODELS = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest', 'gemini-2.5-flash-lite'];
function sysPrompt(scn){
  return `أنت معلّم لغة عبرية صبور جداً لمتعلّم عربي فلسطيني مبتدئ يجد التعلّم صعباً.

قواعد صارمة:

- اكتب نطق الجملة بأحرف عربية (مثل: شالوم، ما شلومْخا).
- اكتب الترجمة العربية.
- إذا كتب المتعلّم بالعبرية وفيها خطأ، صحّحه بلطف واشرح بجملة عربية واحدة بسيطة. إذا كان صحيحاً اترك التصحيح فارغاً.
- إذا كتب المتعلّم بالعربية، علّمه كيف يقولها بالعبرية في حقل tip، ثم أكمل المحادثة.
- استخدم صيغة المذكّر عند مخاطبة المتعلّم.
- في سيناريو "اشرح لي": أجب بالعربية في حقل tip بشرح بسيط مع مثال، وضع المثال العبري في reply_he.
- شجّعه دائماً، ولا تستخدم كلمات صعبة.
أجب فقط بـ JSON بهذا الشكل:
{"reply_he":"...","reply_tr":"...","reply_ar":"...","correction":"...","tip":"..."}`;
}
async function gemini(scn, hist){
  const key = S.set.key.trim(); if (!key) throw new Error('nokey');
  const models = [S.set.model, ...MODELS.filter(m => m !== S.set.model)];
  let lastErr;
  for (const m of models) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
      const hdr = {'Content-Type':'application/json', 'x-goog-api-key':key};
      const body = JSON.stringify({systemInstruction:{parts:[{text:sysPrompt(scn)}]}, contents:hist,
          generationConfig:{responseMimeType:'application/json', temperature:0.7, maxOutputTokens:800}});
      let r, j;
      if (NB && NB.httpPost) {
        const x = await nbCall(id => NB.httpPost(id, url, JSON.stringify(hdr), body));
        if (x.code < 0) throw new Error('fetch: ' + x.text);
        r = {ok:x.code >= 200 && x.code < 300, status:x.code}; try { j = JSON.parse(x.text); } catch(e) { j = {}; }
      } else {
        r = await fetch(url, {method:'POST', headers:hdr, body});
        j = await r.json().catch(() => ({}));
      }
      if (!r.ok) { lastErr = new Error(r.status + ':' + (j.error?.message || '')); if ([404, 429, 500, 503].includes(r.status)) continue; throw lastErr; }
      const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
      if (m !== S.set.model) { S.set.model = m; save(); }
      return txt;
    } catch(e) { lastErr = e; if (e.message.startsWith('400') || e.message.startsWith('403') || e.message.startsWith('401')) break; }
  }
  throw lastErr || new Error('fail');
}
function parseAI(t){
  try { return JSON.parse(t); } catch(e) {}
  const m = t.match(/\{[\s\S]*\}/); if (m) try { return JSON.parse(m[0]); } catch(e) {}
  return {reply_he:'', reply_ar:t};
}
function aiErr(e){
  const m = e.message || '';
  if (m === 'nokey') return 'ضع مفتاح Gemini في الإعدادات ⚙️ أولاً.';
  if (m.startsWith('400') && /key/i.test(m)) return 'المفتاح غير صحيح. انسخه من جديد من aistudio.google.com وضعه في الإعدادات.';
  if (m.startsWith('429')) return 'تجاوزت الحد المجاني مؤقتاً. انتظر دقيقة ثم حاول. (الحد يتجدّد يومياً)';
  if (m.startsWith('403')) return 'جوجل رفضت الطلب (ربما المنطقة أو المفتاح). جرّب مفتاحاً جديداً.';
  if (!navigator.onLine || /fetch/i.test(m)) return 'لا يوجد اتصال بالإنترنت.';
  return 'حدث خطأ: ' + m.slice(0, 120);
}

const CORE = ['basics','verbs1','phrases','people','food','time','home','body','adj','city','shop','work','general'];

// ---------- أسئلة من القاموس ----------
function distract(w, n, field){
  const same = DW.filter(x => x.c === w.c && x !== w && x[field] !== w[field]);
  const any = DW.filter(x => x !== w && x[field] !== w[field]);
  const pool = shuffle(same).slice(0, n * 2).concat(shuffle(any).slice(0, n * 2));
  const out = []; for (const x of pool) { if (!out.some(o => o[field] === x[field])) out.push(x); if (out.length >= n) break; }
  return out;
}
function dictQuestion(w, t){
  const ex = `<span class="tr">${esc(w.tr)}</span> = ${esc(w.ar)}`;
  if (t === 0) return {key:'w:' + w.he, w, ask:'ما معنى هذه الكلمة؟', prompt:`<div class="he">${w.he}</div>`, say:w.he, ans:w.ar, opts:[w, ...distract(w, 3, 'ar')].map(x => x.ar), extra:ex};
  if (t === 1) return {key:'w:' + w.he, w, ask:'كيف تقول بالعبرية:', prompt:`<div style="font-size:28px;font-weight:800">${esc(w.ar)}</div>`, say:w.he, ans:w.he, opts:[w, ...distract(w, 3, 'he')].map(x => x.he), optCls:'he', small:w.he.length > 14, extra:ex};
  if (t === 2) return {key:'w:' + w.he, w, ask:'استمع 🔊 واختر المعنى', prompt:`<button class="icon-btn" style="width:90px;height:90px;font-size:40px" data-say="${esc(w.he)}">🔊</button>`, say:w.he, autoSay:true, ans:w.ar, opts:[w, ...distract(w, 3, 'ar')].map(x => x.ar), extra:`<span class="he">${w.he}</span> ` + ex};
  return {key:'w:' + w.he, w, ask:'هذه الكلمة مكتوبة باليد. ما معناها؟', prompt:`<div class="cur">${stripNiqqud(w.he)}</div>`, say:w.he, ans:w.ar, opts:[w, ...distract(w, 3, 'ar')].map(x => x.ar), extra:`<span class="he">${w.he}</span> ` + ex};
}
const mixQ = (ws, cursiveShare = 0.2) => ws.map((w, k) => dictQuestion(w, Math.random() < cursiveShare && w.he.length < 12 ? 3 : k % 3));
const srsAnswer = (q, ok) => { if (q.w) { srsMark(q.w, ok); } };

window.startExam = type => {
  const intro = introducedList();
  let qs, ttl, pass = 0, after;
  if (type === 'stage') {
    const n = S.exams.stage + 1;
    const batch = intro.slice((n - 1) * 100, n * 100);
    qs = mixQ(shuffle(batch).slice(0, 20), 0.25); ttl = `اختبار المرحلة ${n}`;
    after = pct => { S.exams.stage = n; };
  } else if (type === 'week') {
    const recent = intro.slice(-150), older = intro.slice(0, -150);
    const ws = shuffle(recent).slice(0, 15).concat(shuffle(older.length ? older : recent).slice(0, 6));
    qs = mixQ(ws, 0.25);
    const extraL = letterQuestions(shuffle(LETTERS.map((_, i) => i)).slice(0, 2)).slice(0, 2);
    const extraD = dialogueQuestions({lines:shuffle(DIALOGUES.flatMap(d => d.lines)).slice(0, 2)});
    qs = shuffle(qs.concat(extraL, extraD)); ttl = 'الاختبار الأسبوعي';
    after = () => { S.exams.weekLast = today(); };
  } else {
    const L = S.exams.level + 1, lv = LEVELS[L], prevAt = LEVELS[L - 1].at;
    const range = intro.slice(0, lv.at);
    const latest = range.slice(prevAt), older = range.slice(0, prevAt);
    const ws = shuffle(latest).slice(0, 30).concat(shuffle(older.length ? older : latest).slice(0, 10));
    qs = mixQ(ws, 0.3); ttl = `امتحان المستوى: ${lv.name}`; pass = 80;
    after = pct => { if (pct >= 80) S.exams.level = L; };
  }
  const cont = () => {
    runQuiz(qs, {exam:true, back:'home', onAnswer:srsAnswer, onFinish:(pct, r, n, wrongs) => {
      after(pct); S.exams.hist.push({t:type, title:ttl, pct, r, n, d:today()}); if (S.exams.hist.length > 200) S.exams.hist.shift(); save();
      const passed = !pass || pct >= pass;
      const lvUp = type === 'level' && passed;
      view().innerHTML = lvUp ? certificate(LEVELS[S.exams.level], pct) : `<div class="card result">
        <div class="big">${pct}%</div><div class="stars" style="font-size:34px">${stars(pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0)}</div>
        <h2>${esc(ttl)}: ${passed ? (pct >= 90 ? 'ممتاز 🎉' : pct >= 70 ? 'جيد جداً 👏' : 'انتهى ✓') : 'لم تنجح هذه المرة'}</h2>
        <p class="muted">${r} من ${n} صحيحة${pass && !passed ? ' · تحتاج 80% للنجاح. راجع كلماتك في درس اليوم وحاول مرة أخرى.' : ''}</p>
        ${wrongs.length ? `<div class="card" style="text-align:start"><h3>راجع هذه الكلمات:</h3>${wrongs.slice(0, 12).map(q => q.w ? `<div style="display:flex;gap:8px;align-items:center;margin:4px 0">${spk(q.w.he)}<span class="he" style="font-size:22px">${q.w.he}</span><span>= ${esc(q.w.ar)}</span></div>` : '').join('')}</div>` : ''}
        <div class="row"><button class="btn" onclick="go('home')">الرئيسية</button><button class="btn ghost" onclick="go('exams')">سجل الاختبارات</button></div></div>`;
      addXP(r * 2 + (passed ? 20 : 0));
    }});
    title(ttl);
  };
  if (!qs.length) return toast('تعلّم بعض الكلمات أولاً');
  view().innerHTML = `<div class="card notebook result"><div class="big">📝</div><h2>${esc(ttl)}</h2>
    <p>${qs.length} سؤالاً. في الاختبار لا تُعاد الأسئلة الخاطئة، فالنتيجة تقيس مستواك الحقيقي.${pass ? '<br><b>النجاح: 80% أو أكثر.</b>' : ''}</p>
    <button class="btn wide" id="ex1">ابدأ الاختبار ◀</button></div>`;
  $('#ex1').onclick = cont; title(ttl);
};
function certificate(lv, pct){
  return `<div class="card cert">
    <div class="cert-in">
      <div class="muted">شهادة مستوى</div>
      <div style="font-size:64px">${lv.icon}</div>
      <h2 style="font-size:28px;margin:4px 0">${lv.name}</h2>
      <div class="cur" style="font-size:44px;color:var(--ink)">כל הכבוד</div>
      <p>نجحت في امتحان المستوى بنتيجة <b>${pct}%</b><br>وحفظت أكثر من <b>${lv.at}</b> كلمة عبرية.</p>
      <p class="muted">${new Date().toLocaleDateString('ar')}</p>
    </div>
    <button class="btn wide" onclick="go('home')">استمر نحو المستوى التالي ◀</button></div>`;
}
routes.exams = () => {
  title('سجل الاختبارات');
  const h = S.exams.hist.slice().reverse(), lv = levelOf();
  view().innerHTML = `<div class="card"><h3>${lv.icon} مستواك: ${lv.name}</h3>
    <p class="muted" style="margin:0">كلمات تعلّمتها: ${introducedN()} · ثابتة في الذاكرة: ${solidN()} · اختبارات: ${h.length}</p>
    <div class="lv-row">${LEVELS.map((l, k) => `<span class="${k <= S.exams.level ? 'on' : ''}">${l.icon}<small>${l.at}</small></span>`).join('')}</div></div>
    ${pendingExams().map(e => `<button class="card exam-banner" onclick="startExam('${e.type}')"><b>${e.icon}</b><span><h3>${e.title}</h3><span class="muted">${e.sub}</span></span><span class="go">ابدأ ◀</span></button>`).join('')}
    ${h.length ? `<div class="card"><h3>نتائجك</h3>
      <div class="bars">${S.exams.hist.slice(-20).map(x => `<i style="height:${Math.max(4, x.pct)}%" class="${x.pct >= 80 ? 'hi' : x.pct >= 50 ? 'mid' : 'lo'}" title="${x.pct}%"></i>`).join('')}</div>
      ${h.map(x => `<div class="hist"><span>${x.t === 'level' ? '🎓' : x.t === 'week' ? '📅' : '🎯'} ${esc(x.title)}<small>${x.d}</small></span><b class="${x.pct >= 80 ? 'good' : x.pct >= 50 ? '' : 'bad'}">${x.pct}%</b></div>`).join('')}</div>`
      : `<div class="card"><p style="margin:0">لا توجد اختبارات بعد. أول اختبار مرحلة يظهر بعد أن تتعلّم 100 كلمة، والاختبار الأسبوعي بعد 20 كلمة.</p></div>`}
    <button class="btn line wide" onclick="startExam('week')">اختبار تجريبي الآن</button>`;
};

// ---------- تبويب الكلمات والقاموس ----------
routes.words = () => {
  lastTab = 'words'; title('الكلمات');
  const due = srsDue().length;
  view().innerHTML = `${homeExtras()}
    <h2>المواضيع (${DCATS.length})</h2>
    <div class="cats">${DCATS.map((c, k) => { const ws = DW.filter(w => w.c === k), kn = ws.filter(known).length;
      return `<button class="cat" onclick="go('dcat/${k}')"><b>${c.icon}</b><span style="font-weight:700">${esc(c.title)}</span><br><small>${kn} من ${ws.length}</small><div class="progress" style="margin:6px 0 0"><i style="width:${kn / ws.length * 100}%"></i></div></button>`; }).join('')}</div>
    <h2 style="margin-top:20px">كلمات المسار الأساسي</h2>
    <div class="cats">${VOCAB.map(c => `<button class="cat" onclick="go('cards/${c.id}')"><b>${c.icon}</b><span style="font-weight:700">${c.title}</span><br><small>${c.words.length} كلمة · بطاقات</small></button>`).join('')}</div>`;
};
routes.dcat = k => {
  k = +k; const c = DCATS[k]; if (!c) return go('words');
  title(c.icon + ' ' + c.title);
  const ws = DW.filter(w => w.c === k), unknown = ws.filter(w => !known(w));
  view().innerHTML = `<div class="row" style="margin-bottom:12px">
      <button class="btn" ${unknown.length ? '' : 'disabled'} id="learn">تعلّم 10 جديدة</button>
      <button class="btn ghost" id="cq" ${ws.filter(known).length >= 4 ? '' : 'disabled'}>اختبرني</button></div>
    <div class="wlist">${ws.map(w => wordRow(w)).join('')}</div>`;
  $('#learn').onclick = () => {
    const pick10 = unknown.slice(0, 10);
    flashcards(pick10, {title:c.title, learn:true, next:null});
    pick10.forEach(w => { S.srs[w.he] = S.srs[w.he] || {box:0, due:Date.now()}; }); save();
  };
  $('#cq').onclick = () => runQuiz(mixQ(shuffle(ws.filter(known)).slice(0, 12)), {back:'dcat/' + k, onAnswer:srsAnswer});
};
function wordRow(w){
  const st = S.srs[w.he]; const b = st ? st.box : -1;
  return `<div class="wrow">${spk(w.he)}<div class="wtxt"><span class="he">${w.he}</span><span class="tr tr-opt">${esc(w.tr)}</span></div><div class="war">${esc(w.ar)}${w.cog ? `<small class="cogx">≈ ${esc(w.cog)}</small>` : ''}</div><span class="dotm" title="${b < 0 ? 'جديدة' : b >= 3 ? 'ثابتة' : 'قيد التعلّم'}">${b < 0 ? '○' : b >= 3 ? '●' : '◐'}</span></div>`;
}
routes.dict = q => {
  title('القاموس'); lastTab = 'words';
  view().innerHTML = `<div class="field"><input id="dq" type="search" placeholder="ابحث بالعربي أو بالعبري..." value="${esc(q || '')}" autocomplete="off"></div>
    <p class="muted" id="dn" style="margin-top:-6px"></p><div class="wlist" id="dres"></div>`;
  const inp = $('#dq');
  const run = () => {
    const v = inp.value.trim(); const vh = normHe(v); const va = v.replace(/[ً-ْ]/g, '');
    let res = [];
    if (v) res = DW.filter(w => (vh && normHe(w.he).includes(vh)) || (va && (w.ar.replace(/[ً-ْ]/g, '').includes(va) || w.tr.replace(/[ً-ْ]/g, '').includes(va))));
    else res = ORDER.slice(0, 40);
    $('#dn').textContent = v ? `${res.length} نتيجة` : `${DW.length} كلمة في القاموس — هذه أهمّها:`;
    $('#dres').innerHTML = res.slice(0, 80).map(wordRow).join('') || '<p>لا نتائج. جرّب كلمة أخرى، أو اسأل المعلّم الذكي 🤖</p>';
  };
  inp.oninput = run; run(); setTimeout(() => inp.focus(), 100);
};

// ================= التشغيل =================
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#back').onclick = () => history.length > 1 ? history.back() : go('home');
$('#gear').onclick = () => go('settings');
applySettings(); renderStats(); route();

</script>
</body>
</html>
