name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "islam-dweikat-ivrit-v${VER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "ivrit.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: islam-dweikat-ivrit
          path: islam-dweikat-ivrit-v*.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: عِبريت v${{ env.VER }}
          body: "حمّل ملف ivrit.apk وثبّته على هاتفك."
          make_latest: true
          files: |
            ivrit.apk
            islam-dweikat-ivrit-v*.apk
